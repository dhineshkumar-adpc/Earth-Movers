<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earth Movers — Fleet Management (DEMO with sample data)</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===================== Earth Movers Fleet Management ===================== */
:root{
  --ink:#14171a;
  --charcoal:#1c2024;
  --charcoal-2:#23272c;
  --panel:#2a2f35;
  --panel-light:#31373e;
  --line:#3a4048;
  --yellow:#f5b400;
  --yellow-deep:#e6a300;
  --yellow-dim:#8a6b1f;
  --text:#eef1f4;
  --text-dim:#a8b0b9;
  --text-faint:#6d7680;
  --green:#3ecf6e;
  --red:#ef5b5b;
  --orange:#ff9a3d;
  --blue:#4da3ff;
  --radius:10px;
  --shadow:0 6px 20px rgba(0,0,0,.35);
  --font-display:'Oswald',Arial Narrow,sans-serif;
  --font-body:'Inter',Segoe UI,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--ink);
  color:var(--text);
  font-family:var(--font-body);
  font-size:14px;
  overflow:hidden;
}
a{color:inherit;}
button{font-family:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#40474f;border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:#525a63;}

/* ---------- App shell ---------- */
#app{display:flex;height:100vh;width:100vw;}

/* Sidebar */
#sidebar{
  width:230px;min-width:230px;
  background:linear-gradient(180deg,var(--charcoal-2),var(--ink));
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;
  transition:width .18s ease,min-width .18s ease;
}
#sidebar.collapsed{width:64px;min-width:64px;}
#sidebar.collapsed .nav-label,#sidebar.collapsed .brand-text,#sidebar.collapsed .sidebar-foot-text{display:none;}
.brand{
  display:flex;align-items:center;gap:10px;
  padding:14px 12px;border-bottom:1px solid var(--line);
  cursor:pointer;
}
.brand img{width:36px;height:36px;border-radius:8px;object-fit:cover;flex:none;background:#000;}
.brand-text{line-height:1.15;overflow:hidden;}
.brand-text b{font-family:var(--font-display);font-size:15px;letter-spacing:.5px;color:var(--yellow);display:block;white-space:nowrap;}
.brand-text span{font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:1px;}

.nav{flex:1;overflow-y:auto;padding:8px 8px;}
.nav-group-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text-faint);padding:12px 10px 4px;}
.nav-item{
  display:flex;align-items:center;gap:11px;
  padding:9px 10px;border-radius:8px;color:var(--text-dim);
  cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;
  margin-bottom:2px;
}
.nav-item .ic{width:18px;text-align:center;flex:none;font-size:15px;}
.nav-item:hover{background:var(--panel);color:var(--text);}
.nav-item.active{background:var(--yellow);color:#1a1a1a;font-weight:700;}
.nav-item .badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;padding:1px 6px;border-radius:20px;font-weight:700;}
.nav-item.active .badge{background:#1a1a1a;color:var(--yellow);}

.sidebar-foot{padding:10px;border-top:1px solid var(--line);}
.sidebar-toggle{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:8px;border-radius:8px;background:var(--panel);color:var(--text-dim);
  cursor:pointer;font-size:12px;
}
.sidebar-toggle:hover{background:var(--panel-light);}

/* Main area */
#main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--charcoal);}
#topbar{
  height:56px;flex:none;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:0 18px;
  background:var(--charcoal-2);
}
#topbar .page-title{font-family:var(--font-display);font-size:19px;letter-spacing:.4px;color:var(--text);}
#topbar .page-sub{font-size:12px;color:var(--text-faint);}
.top-spacer{flex:1;}
.top-search{
  display:flex;align-items:center;gap:8px;background:var(--panel);
  border:1px solid var(--line);border-radius:8px;padding:7px 12px;width:260px;
}
.top-search input{background:transparent;border:none;outline:none;color:var(--text);font-size:13px;width:100%;}
.top-search input::placeholder{color:var(--text-faint);}
.icon-btn{
  width:36px;height:36px;border-radius:8px;background:var(--panel);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--text-dim);position:relative;flex:none;
}
.icon-btn:hover{background:var(--panel-light);color:var(--text);}
.icon-btn .dot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--charcoal-2);}

#content{flex:1;overflow-y:auto;padding:20px 22px 60px;}

/* ---------- Generic components ---------- */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:18px;}
.stat-card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;position:relative;overflow:hidden;
}
.stat-card .label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;}
.stat-card .value{font-family:var(--font-display);font-size:24px;color:var(--text);}
.stat-card .sub{font-size:11px;color:var(--text-dim);margin-top:4px;}
.stat-card.accent{border-color:var(--yellow-dim);}
.stat-card.accent .value{color:var(--yellow);}
.stat-card.good .value{color:var(--green);}
.stat-card.bad .value{color:var(--red);}
.stat-card .bar{position:absolute;left:0;top:0;bottom:0;width:4px;}
.stat-card.accent .bar{background:var(--yellow);}
.stat-card.good .bar{background:var(--green);}
.stat-card.bad .bar{background:var(--red);}

.section-title{
  font-family:var(--font-display);font-size:16px;letter-spacing:.4px;color:var(--text);
  margin:22px 0 10px;display:flex;align-items:center;gap:8px;
}
.section-title .tag{font-size:10px;background:var(--panel);border:1px solid var(--line);color:var(--text-faint);padding:2px 8px;border-radius:20px;font-family:var(--font-body);text-transform:uppercase;letter-spacing:.5px;}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
.panel + .panel{margin-top:12px;}

.two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;}
.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media(max-width:1100px){.two-col,.three-col{grid-template-columns:1fr;}}

.hl-list{display:flex;flex-direction:column;gap:8px;}
.hl-row{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;background:var(--panel-light);border-radius:8px;font-size:12.5px;}
.hl-row .l{color:var(--text-dim);}
.hl-row .r{font-weight:700;color:var(--text);}
.hl-row .r.y{color:var(--yellow);}
.hl-row .r.g{color:var(--green);}
.hl-row .r.rd{color:var(--red);}

/* toolbar for entity pages */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.toolbar .flexgrow{flex:1;}
.searchbox{
  display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;min-width:220px;
}
.searchbox input{background:transparent;border:none;outline:none;color:var(--text);width:100%;font-size:13px;}
select.filter,.select-input{
  background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;
  padding:8px 10px;font-size:13px;outline:none;
}

.btn{
  display:inline-flex;align-items:center;gap:7px;border:none;border-radius:8px;
  padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;
}
.btn-primary{background:var(--yellow);color:#1a1a1a;}
.btn-primary:hover{background:var(--yellow-deep);}
.btn-ghost{background:var(--panel);color:var(--text);border:1px solid var(--line);}
.btn-ghost:hover{background:var(--panel-light);}
.btn-danger{background:rgba(239,91,91,.14);color:var(--red);border:1px solid rgba(239,91,91,.35);}
.btn-danger:hover{background:rgba(239,91,91,.25);}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:7px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* table */
.table-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
table.data{width:100%;border-collapse:collapse;font-size:12.8px;}
table.data thead th{
  text-align:left;padding:10px 12px;background:var(--panel-light);color:var(--text-faint);
  font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:600;border-bottom:1px solid var(--line);
  position:sticky;top:0;
}
table.data tbody td{padding:10px 12px;border-bottom:1px solid var(--line);color:var(--text);vertical-align:middle;}
table.data tbody tr:last-child td{border-bottom:none;}
table.data tbody tr:hover{background:var(--panel-light);cursor:pointer;}
table.data .muted{color:var(--text-faint);}
.empty-row td{text-align:center;padding:34px;color:var(--text-faint);}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;}
.pill-green{background:rgba(62,207,110,.15);color:var(--green);}
.pill-yellow{background:rgba(245,180,0,.15);color:var(--yellow);}
.pill-red{background:rgba(239,91,91,.15);color:var(--red);}
.pill-blue{background:rgba(77,163,255,.15);color:var(--blue);}
.pill-gray{background:rgba(168,176,185,.15);color:var(--text-dim);}

.row-actions{display:flex;gap:6px;}
.row-actions .icon-btn{width:28px;height:28px;border-radius:6px;}

/* forms/modals */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;
  z-index:1000;padding:20px;
}
.modal{
  background:var(--charcoal-2);border:1px solid var(--line);border-radius:12px;
  width:100%;max-width:640px;max-height:88vh;display:flex;flex-direction:column;box-shadow:var(--shadow);
}
.modal.wide{max-width:900px;}
.modal-head{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);}
.modal-head h3{margin:0;font-family:var(--font-display);font-size:17px;font-weight:500;letter-spacing:.3px;}
.modal-head .close{margin-left:auto;cursor:pointer;color:var(--text-faint);font-size:20px;line-height:1;}
.modal-body{padding:16px 18px;overflow-y:auto;}
.modal-foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;}
.form-grid.single{grid-template-columns:1fr;}
.field{display:flex;flex-direction:column;gap:5px;}
.field.full{grid-column:1/-1;}
.field label{font-size:11.5px;color:var(--text-dim);font-weight:600;}
.field label .req{color:var(--red);}
.field input,.field select,.field textarea{
  background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);
  padding:9px 10px;font-size:13px;outline:none;font-family:inherit;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--yellow-dim);}
.field textarea{resize:vertical;min-height:60px;}
.field-hint{font-size:10.5px;color:var(--text-faint);}
.field input[type=file]{padding:6px;}
.img-preview{width:100%;max-width:160px;height:100px;object-fit:cover;border-radius:8px;border:1px solid var(--line);margin-top:6px;background:#111;}

/* Detail pages */
.detail-header{
  display:flex;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:16px;margin-bottom:14px;
}
.detail-avatar{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--panel-light);flex:none;border:1px solid var(--line);}
.detail-title{font-family:var(--font-display);font-size:20px;color:var(--text);}
.detail-meta{font-size:12px;color:var(--text-faint);margin-top:2px;}
.detail-metrics{display:flex;gap:18px;margin-left:auto;flex-wrap:wrap;}
.dm{text-align:right;}
.dm .v{font-family:var(--font-display);font-size:17px;color:var(--yellow);}
.dm .l{font-size:10px;color:var(--text-faint);text-transform:uppercase;}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto;}
.tab{padding:9px 14px;font-size:12.5px;color:var(--text-dim);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-weight:600;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--yellow);border-color:var(--yellow);}

.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-dim);font-size:12.5px;cursor:pointer;margin-bottom:10px;}
.back-link:hover{color:var(--yellow);}

/* timeline */
.timeline{border-left:2px solid var(--line);margin-left:6px;padding-left:16px;}
.tl-item{position:relative;padding-bottom:16px;}
.tl-item::before{content:'';position:absolute;left:-21px;top:3px;width:9px;height:9px;border-radius:50%;background:var(--yellow);}
.tl-date{font-size:10.5px;color:var(--text-faint);}
.tl-text{font-size:13px;color:var(--text);margin-top:2px;}

/* toast */
#toast-wrap{position:fixed;bottom:18px;right:18px;z-index:2000;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--yellow);color:var(--text);
  padding:11px 15px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);min-width:220px;animation:slidein .18s ease;}
.toast.danger{border-left-color:var(--red);}
.toast.success{border-left-color:var(--green);}
@keyframes slidein{from{transform:translateX(20px);opacity:0;}to{transform:translateX(0);opacity:1;}}

/* login */
#login-screen{
  position:fixed;inset:0;background:radial-gradient(circle at 30% 20%,#2a2f35,#0f1113 70%);
  display:flex;align-items:center;justify-content:center;z-index:5000;
}
.login-card{background:var(--charcoal-2);border:1px solid var(--line);border-radius:14px;padding:34px 32px;width:340px;box-shadow:var(--shadow);text-align:center;}
.login-card img{width:84px;height:84px;border-radius:14px;margin-bottom:12px;object-fit:cover;}
.login-card h1{font-family:var(--font-display);font-size:20px;color:var(--yellow);margin:0 0 2px;}
.login-card p{color:var(--text-faint);font-size:12px;margin:0 0 20px;}
.login-card input{width:100%;margin-bottom:10px;}
.login-card .btn{width:100%;justify-content:center;margin-top:6px;}
.login-err{color:var(--red);font-size:12px;min-height:16px;margin-top:4px;}

/* Empty state */
.empty-state{text-align:center;padding:50px 20px;color:var(--text-faint);}
.empty-state .ic{font-size:34px;margin-bottom:10px;opacity:.5;}
.empty-state h4{color:var(--text-dim);margin:0 0 4px;font-family:var(--font-display);font-weight:500;}

/* mini bar chart */
.barchart{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:6px;}
.barchart .bar{flex:1;background:linear-gradient(180deg,var(--yellow),var(--yellow-deep));border-radius:4px 4px 0 0;position:relative;min-height:2px;}
.barchart .bar .bv{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:9.5px;color:var(--text-dim);}
.barchart .bar .bl{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:9.5px;color:var(--text-faint);white-space:nowrap;}
.barchart-wrap{margin-bottom:24px;}

.progress{height:6px;border-radius:4px;background:var(--panel-light);overflow:hidden;}
.progress > div{height:100%;background:var(--yellow);}

.kpi-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
.kpi-chip{background:var(--panel-light);border-radius:8px;padding:8px 12px;font-size:12px;}
.kpi-chip b{display:block;font-family:var(--font-display);font-size:16px;color:var(--text);}

/* print area (hidden on screen, shown in print window) */
.print-only{display:none;}

.small-note{font-size:11px;color:var(--text-faint);margin-top:8px;}
hr.sep{border:none;border-top:1px solid var(--line);margin:14px 0;}

.checkbox-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-dim);}
.checkbox-row input{width:auto;}

@media(max-width:820px){
  #sidebar{position:fixed;left:0;top:0;bottom:0;z-index:900;box-shadow:var(--shadow);}
  #sidebar:not(.collapsed){width:220px;}
  #sidebar.collapsed{width:0;min-width:0;border:none;overflow:hidden;}
  .form-grid{grid-template-columns:1fr;}
  .detail-metrics{margin-left:0;width:100%;justify-content:flex-start;}
  #topbar{padding:0 10px;gap:8px;}
  .top-search{width:150px;}
}

</style>
</head>

<script>
/* =========================================================================
   EARTH MOVERS — Fleet, Rental, Site & Business Management System
   100% Offline. All data stored locally (localStorage). No internet needed.
   ========================================================================= */

/* ---------------------------- Small utilities ---------------------------- */
const $ = (sel,root=document)=>root.querySelector(sel);
const $$ = (sel,root=document)=>Array.from(root.querySelectorAll(sel));
function uid(prefix){ return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function nowStamp(){ return new Date().toISOString(); }
function esc(s){ if(s===undefined||s===null) return ''; return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtMoney(n){
  n = Number(n)||0;
  const sym = (DB.settings && DB.settings.currency) || '₹';
  return sym + n.toLocaleString('en-IN',{maximumFractionDigits:2, minimumFractionDigits: (n%1!==0)?2:0});
}
function fmtNum(n){ return Number(n||0).toLocaleString('en-IN'); }
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d+'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
}
function fmtDateTime(iso){
  if(!iso) return '—';
  const dt = new Date(iso);
  if(isNaN(dt)) return iso;
  return dt.toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function daysBetween(a,b){
  const d1=new Date(a+'T00:00:00'), d2=new Date(b+'T00:00:00');
  return Math.round((d2-d1)/86400000);
}
function daysFromToday(dateStr){
  if(!dateStr) return null;
  return daysBetween(todayISO(), dateStr);
}
function clamp(n,min,max){ return Math.max(min,Math.min(max,n)); }
function sum(arr,fn){ return arr.reduce((s,x)=>s+(Number(fn?fn(x):x)||0),0); }
function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }

function toast(msg,type){
  const wrap = $('#toast-wrap');
  const el = document.createElement('div');
  el.className='toast'+(type?' '+type:'');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 2600);
}

/* ---------------------------- Data layer (localStorage) ---------------------------- */
const STORE_KEY = 'earthmovers_db_v1';

const DEFAULT_DB = {
  meta:{ version:1, created:nowStamp() },
  settings:{
    companyName:'Earth Movers',
    tagline:'Fleet · Site · Billing · Management',
    logoDataUrl:'', // filled at runtime from EMBEDDED_LOGO
    currency:'₹',
    defaultTaxPercent:0,
    soundEnabled:true,
    invoicePrefix:'INV',
    receiptPrefix:'RCT',
    nextInvoiceSeq:1,
    nextReceiptSeq:1,
    serviceReminderDays:7,
    docExpiryReminderDays:30
  },
  users:[
    {id:'u_admin', username:'admin', password:'admin123', role:'Admin', name:'Owner / Admin'}
  ],
  session:null,
  vehicles:[], drivers:[], customers:[], sites:[], jobs:[],
  expenses:[], income:[], maintenance:[], invoices:[], receipts:[],
  advances:[], salaries:[], driverActivities:[], documents:[], tasks:[],
  auditLog:[]
};

let DB = null;

function loadDB(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ DB = JSON.parse(raw); }
    else { DB = JSON.parse(JSON.stringify(DEFAULT_DB)); }
  }catch(e){ console.error('DB load failed, resetting.', e); DB = JSON.parse(JSON.stringify(DEFAULT_DB)); }
  // ensure all keys exist (for older saved data / upgrades)
  for(const k in DEFAULT_DB){ if(!(k in DB)) DB[k] = JSON.parse(JSON.stringify(DEFAULT_DB[k])); }
  for(const k in DEFAULT_DB.settings){ if(!(k in DB.settings)) DB.settings[k] = DEFAULT_DB.settings[k]; }
  if(!DB.settings.logoDataUrl) DB.settings.logoDataUrl = (typeof EMBEDDED_LOGO!=='undefined'?EMBEDDED_LOGO:'');
}
function saveDB(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }
  catch(e){ console.error(e); toast('Save failed — storage may be full.','danger'); }
}
let saveTimer=null;
function saveDBDebounced(){ clearTimeout(saveTimer); saveTimer=setTimeout(saveDB,150); }

function audit(action,entityType,entityId,summary){
  DB.auditLog.unshift({
    id:uid('log'), ts:nowStamp(), user:(DB.session&&DB.session.name)||'System',
    action, entityType, entityId, summary
  });
  if(DB.auditLog.length>3000) DB.auditLog.length=3000;
}

function listOf(type){ return DB[type] || []; }
function getById(type,id){ return (DB[type]||[]).find(x=>x.id===id); }
function addRecord(type,obj,label){
  obj.id = obj.id || uid(type.slice(0,3));
  obj.createdAt = nowStamp(); obj.updatedAt = nowStamp();
  DB[type].push(obj);
  audit('create',type,obj.id, label||('Added '+type.slice(0,-1)));
  saveDBDebounced();
  return obj;
}
function updateRecord(type,id,patch,label){
  const rec = getById(type,id);
  if(!rec) return null;
  Object.assign(rec,patch);
  rec.updatedAt = nowStamp();
  audit('update',type,id, label||('Updated '+type.slice(0,-1)));
  saveDBDebounced();
  return rec;
}
function removeRecord(type,id,label){
  const idx = DB[type].findIndex(x=>x.id===id);
  if(idx<0) return false;
  DB[type].splice(idx,1);
  audit('delete',type,id,label||('Deleted '+type.slice(0,-1)));
  saveDBDebounced();
  return true;
}

/* ---------------------------- Options / lookups ---------------------------- */
function vehicleOptions(){ return DB.vehicles.map(v=>({value:v.id,label:(v.regNumber||'—')+' — '+(v.name||v.type||'')})); }
function driverOptions(){ return DB.drivers.map(d=>({value:d.id,label:d.name})); }
function customerOptions(){ return DB.customers.map(c=>({value:c.id,label:c.name+(c.businessName?' ('+c.businessName+')':'')})); }
function siteOptions(){ return DB.sites.map(s=>({value:s.id,label:s.name})); }
function jobOptions(){ return DB.jobs.map(j=>({value:j.id,label:(getById('vehicles',j.vehicleId)||{}).regNumber+' — '+fmtDate(j.startDate)})); }
function invoiceOptions(){ return DB.invoices.map(i=>({value:i.id,label:i.invoiceNumber})); }

const VEHICLE_STATUS = ['Available','Working','Maintenance','Breakdown','Inactive'];
const JOB_STATUS = ['Ongoing','Completed','Cancelled'];
const RATE_TYPES = ['Hourly','Daily'];
const EXPENSE_CATEGORIES = ['Fuel/Diesel','Service','Spare Parts','Repairs','Tyres','Battery','Lubricants','Insurance','Permit','FC','Driver-related','Transport','Breakdown','Accident/Damage','Miscellaneous'];
const MAINT_TYPES = ['Service','Repair','Breakdown','Accident/Damage'];
const PAYMENT_METHODS = ['Cash','UPI','Bank Transfer','Cheque','Card','Other'];
const DOC_TYPES_VEHICLE = ['RC','Insurance','FC','Permit','Pollution Certificate','Other'];
const DOC_TYPES_DRIVER = ['ID Proof','Driving Licence','Other'];
const TASK_PRIORITY = ['Low','Medium','High','Urgent'];
const TASK_STATUS = ['Pending','In Progress','Completed'];
const EMPLOYMENT_STATUS = ['Active','Inactive','On Leave'];
const SALARY_TYPES = ['Monthly','Daily Wage'];
const SITE_STATUS = ['Active','Completed','Paused'];
const INVOICE_STATUS = ['Unpaid','Partial','Paid'];
const POS_ACTIVITIES = ['Good maintenance of vehicle','Safe driving','Excellent attendance','Customer appreciation','Prevented damage','Completed work efficiently','Other'];
const NEG_ACTIVITIES = ['Vehicle damage','Careless operation','Repeated breakdown issue','Late attendance','Customer complaint','Improper vehicle handling','Other'];
const SEVERITY = ['Low','Medium','High'];

/* ---------------------------- Computed / derived helpers ---------------------------- */
function jobAmount(job){
  const qty = Number(job.quantity)||0, rate=Number(job.rate)||0;
  return qty*rate;
}
function jobBalance(job){ return jobAmount(job) - (Number(job.advanceReceived)||0); }

function vehicleIncomeTotal(vehicleId, from, to){
  let total = 0;
  DB.jobs.filter(j=>j.vehicleId===vehicleId && inRange(j.startDate,from,to)).forEach(j=> total += jobAmount(j));
  DB.income.filter(i=>i.vehicleId===vehicleId && inRange(i.date,from,to)).forEach(i=> total += Number(i.grossAmount)||0);
  return total;
}
function vehicleExpenseTotal(vehicleId, from, to){
  let total = sum(DB.expenses.filter(e=>e.vehicleId===vehicleId && inRange(e.date,from,to)), e=>e.amount);
  total += sum(DB.maintenance.filter(m=>m.vehicleId===vehicleId && inRange(m.date,from,to)), m=>maintTotalCost(m));
  return total;
}
function vehicleProfit(vehicleId, from, to){
  return vehicleIncomeTotal(vehicleId,from,to) - vehicleExpenseTotal(vehicleId,from,to);
}
function maintTotalCost(m){ return (Number(m.partsCost)||0)+(Number(m.labourCost)||0); }

function inRange(dateStr, from, to){
  if(!dateStr) return false;
  if(from && dateStr < from) return false;
  if(to && dateStr > to) return false;
  return true;
}
function periodRange(period){
  const now = new Date();
  const pad = n=>String(n).padStart(2,'0');
  const iso = d=> d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  if(period==='today'){ const t=iso(now); return [t,t]; }
  if(period==='week'){
    const day = now.getDay()||7; const start=new Date(now); start.setDate(now.getDate()-day+1);
    return [iso(start), iso(now)];
  }
  if(period==='month'){ const start=new Date(now.getFullYear(),now.getMonth(),1); return [iso(start), iso(now)]; }
  if(period==='year'){ const start=new Date(now.getFullYear(),0,1); return [iso(start), iso(now)]; }
  return [null,null];
}

function totalIncomeInRange(from,to){
  let t = sum(DB.jobs.filter(j=>inRange(j.startDate,from,to)), j=>jobAmount(j));
  t += sum(DB.income.filter(i=>inRange(i.date,from,to)), i=>i.grossAmount);
  return t;
}
function totalExpenseInRange(from,to){
  let t = sum(DB.expenses.filter(e=>inRange(e.date,from,to)), e=>e.amount);
  t += sum(DB.maintenance.filter(m=>inRange(m.date,from,to)), m=>maintTotalCost(m));
  t += sum(DB.salaries.filter(s=>inRange(s.paymentDate,from,to)), s=>s.paidAmount);
  return t;
}
function totalProfitInRange(from,to){ return totalIncomeInRange(from,to) - totalExpenseInRange(from,to); }

function driverPoints(driverId){
  const acts = DB.driverActivities.filter(a=>a.driverId===driverId);
  const pos = sum(acts.filter(a=>a.type==='positive'), a=>a.points);
  const neg = sum(acts.filter(a=>a.type==='negative'), a=>a.points);
  return {pos, neg, net:pos-neg, posCount:acts.filter(a=>a.type==='positive').length, negCount:acts.filter(a=>a.type==='negative').length};
}
function driverAdvanceOutstanding(driverId){
  const totalAdv = sum(DB.advances.filter(a=>a.driverId===driverId), a=>a.amount);
  const totalDeducted = sum(DB.salaries.filter(s=>s.driverId===driverId), s=>s.advanceDeducted);
  return totalAdv - totalDeducted;
}
function driverRevenue(driverId, from, to){
  return sum(DB.jobs.filter(j=>j.driverId===driverId && inRange(j.startDate,from,to)), j=>jobAmount(j));
}
function driverIncidentCount(driverId){
  return DB.maintenance.filter(m=>{
    if(m.type!=='Breakdown' && m.type!=='Accident/Damage') return false;
    // was this driver assigned to the vehicle at the time? approximate: any job overlapping the date
    return DB.jobs.some(j=> j.vehicleId===m.vehicleId && j.driverId===driverId && j.startDate<=m.date && (j.endDate||'9999-99-99')>=m.date);
  }).length;
}

function salaryNet(s){
  const base = s.salaryType==='Daily Wage' ? (Number(s.dailyRate)||0)*(Number(s.daysWorked)||0) : (Number(s.baseSalary)||0);
  return base + (Number(s.overtime)||0) + (Number(s.bonus)||0) - (Number(s.deductions)||0) - (Number(s.advanceDeducted)||0);
}
function salaryBalance(s){ return salaryNet(s) - (Number(s.paidAmount)||0); }

function invoiceTotal(inv){
  const base = (Number(inv.quantity)||0)*(Number(inv.rate)||0);
  const withExtra = base + (Number(inv.additionalCharges)||0) - (Number(inv.discount)||0);
  const tax = withExtra * ((Number(inv.taxPercent)||0)/100);
  return withExtra + tax;
}
function invoiceBalance(inv){ return invoiceTotal(inv) - (Number(inv.paid)||0); }
function invoiceStatusAuto(inv){
  const bal = invoiceBalance(inv);
  if(bal<=0.001) return 'Paid';
  if((Number(inv.paid)||0)>0) return 'Partial';
  return 'Unpaid';
}

function nextInvoiceNumber(){
  const n = DB.settings.nextInvoiceSeq||1;
  DB.settings.nextInvoiceSeq = n+1;
  return DB.settings.invoicePrefix+'-'+String(n).padStart(4,'0');
}
function nextReceiptNumber(){
  const n = DB.settings.nextReceiptSeq||1;
  DB.settings.nextReceiptSeq = n+1;
  return DB.settings.receiptPrefix+'-'+String(n).padStart(4,'0');
}

/* ---------------------------- Notifications engine ---------------------------- */
function computeNotifications(){
  const list = [];
  const remDoc = DB.settings.docExpiryReminderDays||30;
  const remSvc = DB.settings.serviceReminderDays||7;

  DB.documents.forEach(d=>{
    if(!d.expiryDate) return;
    const days = daysFromToday(d.expiryDate);
    if(days!==null && days<=remDoc){
      const owner = d.refType==='vehicle'? getById('vehicles',d.refId) : getById('drivers',d.refId);
      const ownerLabel = owner ? (d.refType==='vehicle'? owner.regNumber : owner.name) : '—';
      list.push({
        type: days<0?'danger':'warning',
        icon:'📄',
        title: (days<0?'Expired: ':'Expiring: ')+d.docType+' — '+ownerLabel,
        detail: days<0? Math.abs(days)+' day(s) overdue' : 'expires in '+days+' day(s) ('+fmtDate(d.expiryDate)+')',
        go:{view:d.refType==='vehicle'?'vehicle-detail':'driver-detail', id:d.refId}
      });
    }
  });
  DB.vehicles.forEach(v=>{
    if(!v.nextServiceDate) return;
    const days = daysFromToday(v.nextServiceDate);
    if(days!==null && days<=remSvc){
      list.push({
        type: days<0?'danger':'warning', icon:'🔧',
        title:(days<0?'Overdue service: ':'Service due: ')+v.regNumber,
        detail: days<0? Math.abs(days)+' day(s) overdue' : 'due in '+days+' day(s)',
        go:{view:'vehicle-detail', id:v.id}
      });
    }
  });
  DB.tasks.forEach(t=>{
    if(t.status==='Completed') return;
    const days = daysFromToday(t.dueDate);
    if(t.dueDate && days!==null && days<=2){
      list.push({ type: days<0?'danger':'warning', icon:'✅',
        title:(days<0?'Overdue task: ':'Task due: ')+t.title,
        detail: days<0? Math.abs(days)+' day(s) overdue' : (days===0?'due today':'due in '+days+' day(s)'),
        go:{view:'tasks'} });
    }
  });
  DB.jobs.forEach(j=>{
    if(j.status==='Cancelled') return;
    if(jobBalance(j) > 0.5 && j.status==='Completed'){
      const cust = getById('customers',j.customerId);
      list.push({ type:'info', icon:'💰',
        title:'Payment pending — '+(cust?cust.name:'Customer'),
        detail: fmtMoney(jobBalance(j))+' outstanding',
        go:{view:'jobs'} });
    }
  });
  DB.invoices.forEach(inv=>{
    if(invoiceBalance(inv) > 0.5){
      const cust = getById('customers',inv.customerId);
      list.push({ type:'info', icon:'🧾',
        title:'Invoice '+inv.invoiceNumber+' unpaid',
        detail: fmtMoney(invoiceBalance(inv))+' due — '+(cust?cust.name:''),
        go:{view:'invoices'} });
    }
  });
  return list;
}

function statusPill(status){
  if(!status) return '—';
  const map = {
    'Available':'green','Working':'blue','Maintenance':'yellow','Breakdown':'red','Inactive':'gray',
    'Active':'green','Completed':'green','Cancelled':'red','Ongoing':'blue','Paused':'yellow',
    'Paid':'green','Partial':'yellow','Unpaid':'red',
    'Pending':'yellow','In Progress':'blue',
    'On Leave':'yellow',
    'Low':'gray','Medium':'blue','High':'yellow','Urgent':'red',
    'Service':'blue','Repair':'yellow','Breakdown/Accident':'red','Accident/Damage':'red',
  };
  const c = map[status]||'gray';
  return '<span class="pill pill-'+c+'">'+esc(status)+'</span>';
}
function refLabel(type,id){
  if(!id) return '<span class="muted">—</span>';
  const rec = getById(type,id);
  if(!rec) return '<span class="muted">—</span>';
  if(type==='vehicles') return esc(rec.regNumber||rec.name);
  if(type==='drivers') return esc(rec.name);
  if(type==='customers') return esc(rec.name);
  if(type==='sites') return esc(rec.name);
  return esc(rec.name||rec.id);
}
function docExpiryBadge(exp){
  if(!exp) return '<span class="muted">—</span>';
  const days = daysFromToday(exp);
  if(days<0) return '<span class="pill pill-red">Expired '+fmtDate(exp)+'</span>';
  if(days<=30) return '<span class="pill pill-yellow">'+fmtDate(exp)+' ('+days+'d)</span>';
  return '<span class="pill pill-green">'+fmtDate(exp)+'</span>';
}
function customerOutstanding(customerId){
  let t = sum(DB.jobs.filter(j=>j.customerId===customerId), j=>jobBalance(j));
  t += sum(DB.invoices.filter(i=>i.customerId===customerId), i=>invoiceBalance(i));
  return t;
}

let modalStack = [];

function closeModal(){
  const top = modalStack.pop();
  if(top && top.el) top.el.remove();
}
function closeAllModals(){ $$('.modal-backdrop').forEach(m=>m.remove()); modalStack=[]; }

function openModal({title, bodyHtml, wide, onMount, footButtons}){
  const backdrop = document.createElement('div');
  backdrop.className='modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal ${wide?'wide':''}">
      <div class="modal-head"><h3>${esc(title)}</h3><span class="close">&times;</span></div>
      <div class="modal-body">${bodyHtml}</div>
      <div class="modal-foot"></div>
    </div>`;
  document.body.appendChild(backdrop);
  const modalEl = $('.modal',backdrop);
  $('.close',backdrop).onclick = closeModal;
  backdrop.addEventListener('mousedown',(e)=>{ if(e.target===backdrop) closeModal(); });
  const foot = $('.modal-foot',backdrop);
  (footButtons||[]).forEach(b=>{
    const btn=document.createElement('button');
    btn.className='btn '+(b.cls||'btn-ghost'); btn.textContent=b.label;
    btn.onclick=b.onClick;
    foot.appendChild(btn);
  });
  modalStack.push({el:backdrop});
  if(onMount) onMount(backdrop);
  return backdrop;
}

function fieldInputHtml(f, value){
  const val = value===undefined||value===null? (typeof f.default==='function'?f.default():(f.default!==undefined?f.default:'')) : value;
  const reqMark = f.required? ' <span class="req">*</span>':'';
  let inner='';
  if(f.type==='select'){
    const opts = f.optionsFn ? f.optionsFn() : (f.options||[]).map(o=>({value:o,label:o}));
    inner = `<select data-field="${f.key}"><option value="">— Select —</option>` +
      opts.map(o=>`<option value="${esc(o.value)}" ${String(o.value)===String(val)?'selected':''}>${esc(o.label)}</option>`).join('') +
      `</select>`;
  } else if(f.type==='textarea'){
    inner = `<textarea data-field="${f.key}" placeholder="${esc(f.placeholder||'')}">${esc(val||'')}</textarea>`;
  } else if(f.type==='image'){
    inner = `<input type="file" accept="image/*" data-field="${f.key}" data-imgfield="1">` +
      (val? `<img src="${val}" class="img-preview" data-preview="${f.key}">` : `<img src="" class="img-preview" data-preview="${f.key}" style="display:none">`);
  } else if(f.type==='number'){
    inner = `<input type="number" step="any" data-field="${f.key}" value="${val!==undefined&&val!==''?esc(val):''}" placeholder="${esc(f.placeholder||'0')}">`;
  } else if(f.type==='date'){
    inner = `<input type="date" data-field="${f.key}" value="${esc(val||'')}">`;
  } else if(f.type==='time'){
    inner = `<input type="time" data-field="${f.key}" value="${esc(val||'')}">`;
  } else {
    inner = `<input type="text" data-field="${f.key}" value="${esc(val||'')}" placeholder="${esc(f.placeholder||'')}">`;
  }
  return `<div class="field ${f.full?'full':''}"><label>${esc(f.label)}${reqMark}</label>${inner}${f.hint?`<div class="field-hint">${esc(f.hint)}</div>`:''}</div>`;
}

function renderFormFields(fields, existing){
  return `<div class="form-grid">` + fields.map(f=>fieldInputHtml(f, existing?existing[f.key]:undefined)).join('') + `</div>`;
}

function wireImageInputs(container){
  $$('input[data-imgfield]',container).forEach(inp=>{
    inp.addEventListener('change', e=>{
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        const key = inp.getAttribute('data-field');
        const img = $(`img[data-preview="${key}"]`,container);
        if(img){ img.src = reader.result; img.style.display='block'; }
        inp.setAttribute('data-value', reader.result);
      };
      reader.readAsDataURL(file);
    });
  });
}

function collectFormData(container, fields){
  const data = {};
  let missing = [];
  fields.forEach(f=>{
    if(f.type==='image'){
      const inp = $(`input[data-field="${f.key}"]`,container);
      const hasNewVal = inp && inp.getAttribute('data-value');
      if(hasNewVal) data[f.key] = inp.getAttribute('data-value');
      return; // if no new file chosen, leave existing untouched (handled by caller merge)
    }
    const el = $(`[data-field="${f.key}"]`,container);
    if(!el) return;
    let v = el.value;
    if(f.type==='number') v = v===''? '' : Number(v);
    data[f.key] = v;
    if(f.required && (v===''||v===undefined||v===null)) missing.push(f.label);
  });
  return {data, missing};
}

function openEntityForm(type, existingId){
  const schema = SCHEMAS[type];
  const existing = existingId? getById(type, existingId) : null;
  const modal = openModal({
    title: (existing? 'Edit ':'Add ')+schema.label,
    wide:true,
    bodyHtml: renderFormFields(schema.fields, existing),
    footButtons:[
      {label:'Cancel', cls:'btn-ghost', onClick:closeModal},
      {label: existing?'Save Changes':'Add '+schema.label, cls:'btn-primary', onClick:()=>{
        const body = $('.modal-body',modal);
        const {data, missing} = collectFormData(body, schema.fields);
        if(missing.length){ toast('Please fill: '+missing.join(', '),'danger'); return; }
        if(existing){
          updateRecord(type, existing.id, data, schema.label+' updated: '+(data[schema.fields[schema.fields.length-1] ? '' : '']||''));
          toast(schema.label+' updated','success');
        } else {
          addRecord(type, data, 'New '+schema.label+' added');
          toast(schema.label+' added','success');
        }
        closeModal();
        renderView(currentView, currentViewParam);
      }}
    ]
  });
  wireImageInputs($('.modal-body',modal));
}

function confirmDialog(msg, onYes){
  openModal({
    title:'Please Confirm',
    bodyHtml:`<p style="color:var(--text-dim);font-size:13.5px;line-height:1.5">${esc(msg)}</p>`,
    footButtons:[
      {label:'Cancel', cls:'btn-ghost', onClick:closeModal},
      {label:'Yes, Continue', cls:'btn-danger', onClick:()=>{ closeModal(); onYes(); }}
    ]
  });
}

function renderGenericList(type){
  const schema = SCHEMAS[type];
  const state = viewState[type] || (viewState[type] = {q:'', filter:''});

  let rows = listOf(type).slice().sort((a,b)=> (b.updatedAt||'').localeCompare(a.updatedAt||''));
  if(state.q){
    const q = state.q.toLowerCase();
    rows = rows.filter(r=>{
      const hay = (schema.searchFields||[]).map(f=>String(r[f]||'')).join(' ').toLowerCase()
        + ' ' + Object.values(r).join(' ').toLowerCase();
      return hay.includes(q);
    });
  }
  if(state.filter && schema.filterField){
    rows = rows.filter(r=> r[schema.filterField.key]===state.filter);
  }

  const html = `
    <div class="toolbar">
      <div class="searchbox" style="min-width:260px">
        <span>🔎</span><input id="gl-search" placeholder="Search ${esc(schema.plural.toLowerCase())}..." value="${esc(state.q)}">
      </div>
      ${schema.filterField? `<select class="filter" id="gl-filter">
          <option value="">All ${esc(schema.filterField.key)}</option>
          ${schema.filterField.options.map(o=>`<option value="${esc(o)}" ${o===state.filter?'selected':''}>${esc(o)}</option>`).join('')}
        </select>`:''}
      <div class="flexgrow"></div>
      <span class="small-note" style="margin:0 6px">${rows.length} record(s)</span>
      <button class="btn btn-primary" id="gl-add">+ Add ${esc(schema.label)}</button>
    </div>
    <div class="table-wrap"><table class="data">
      <thead><tr>${schema.columns.map(c=>`<th>${esc(c.label)}</th>`).join('')}<th style="width:90px">Actions</th></tr></thead>
      <tbody>
      ${rows.length? rows.map(r=>`
        <tr data-id="${r.id}">
          ${schema.columns.map(c=>`<td>${c.render? c.render(r) : esc(r[c.key]!==undefined?r[c.key]:'—')}</td>`).join('')}
          <td class="row-actions">
            <span class="icon-btn btn-sm" data-act="edit" title="Edit">✏️</span>
            <span class="icon-btn btn-sm" data-act="del" title="Delete">🗑️</span>
          </td>
        </tr>`).join('') : `<tr class="empty-row"><td colspan="${schema.columns.length+1}">No ${esc(schema.plural.toLowerCase())} yet. Click "Add ${esc(schema.label)}" to create the first one.</td></tr>`}
      </tbody>
    </table></div>
  `;
  $('#content').innerHTML = html;

  $('#gl-search').oninput = debounce(e=>{ state.q = e.target.value; renderGenericList(type); }, 200);
  if($('#gl-filter')) $('#gl-filter').onchange = e=>{ state.filter = e.target.value; renderGenericList(type); };
  $('#gl-add').onclick = ()=> openEntityForm(type);

  $$('table.data tbody tr[data-id]').forEach(tr=>{
    tr.addEventListener('click', e=>{
      const id = tr.getAttribute('data-id');
      const act = e.target.closest('[data-act]');
      if(act){
        e.stopPropagation();
        if(act.getAttribute('data-act')==='edit') openEntityForm(type,id);
        if(act.getAttribute('data-act')==='del'){
          confirmDialog('Delete this '+schema.label.toLowerCase()+'? This cannot be undone.', ()=>{
            removeRecord(type,id);
            toast(schema.label+' deleted','success');
            renderGenericList(type);
          });
        }
        return;
      }
      if(schema.hasDetail){ navigate(type.slice(0,-1)+'-detail', id); }
      else { openEntityForm(type,id); }
    });
  });
}

function buildVehicleTimeline(v){
  let ev = [];
  if(v.purchaseDate) ev.push({date:v.purchaseDate, text:'🛒 Vehicle purchased'+(v.purchasePrice?' for '+fmtMoney(v.purchasePrice):'')});
  DB.jobs.filter(j=>j.vehicleId===v.id).forEach(j=>ev.push({date:j.startDate, text:'🧾 Job started at '+refLabelPlain('sites',j.siteId)+' — '+fmtMoney(jobAmount(j))}));
  DB.maintenance.filter(m=>m.vehicleId===v.id).forEach(m=>ev.push({date:m.date, text:'🔧 '+m.type+': '+(m.problem||'')+' — '+fmtMoney(maintTotalCost(m))}));
  DB.expenses.filter(e=>e.vehicleId===v.id).forEach(e=>ev.push({date:e.date, text:'💸 '+e.category+' expense — '+fmtMoney(e.amount)}));
  return ev.filter(e=>e.date).sort((a,b)=>b.date.localeCompare(a.date));
}

function openActivityForm(driverId, type){
  const list = type==='positive'?POS_ACTIVITIES:NEG_ACTIVITIES;
  const fields = [
    {key:'date',label:'Date',type:'date',required:true,default:()=>todayISO()},
    {key:'activity',label:'Activity',type:'select',options:list,required:true},
    {key:'points',label:'Points',type:'number',required:true,default:type==='positive'?5:5},
    ...(type==='negative'?[{key:'severity',label:'Severity',type:'select',options:SEVERITY,default:'Medium'}]:[]),
    {key:'description',label:'Description',type:'textarea',full:true},
    {key:'notes',label:'Notes',type:'textarea',full:true},
  ];
  const modal = openModal({
    title:(type==='positive'?'Add Positive Activity':'Add Negative Activity'), wide:true,
    bodyHtml: renderFormFields(fields,{}),
    footButtons:[
      {label:'Cancel',cls:'btn-ghost',onClick:closeModal},
      {label:'Save',cls: type==='positive'?'btn-primary':'btn-danger', onClick:()=>{
        const body=$('.modal-body',modal);
        const {data,missing}=collectFormData(body,fields);
        if(missing.length){ toast('Please fill: '+missing.join(', '),'danger'); return; }
        data.driverId=driverId; data.type=type; data.recordedBy=(DB.session&&DB.session.name)||'Owner';
        addRecord('driverActivities',data,'Driver activity logged');
        toast('Activity recorded','success'); closeModal();
        renderDriverDetail(driverId);
      }}
    ]
  });
}

function openEntityFormPreset(type, preset){
  const schema = SCHEMAS[type];
  const modal = openModal({
    title:'Add '+schema.label, wide:true,
    bodyHtml: renderFormFields(schema.fields, preset),
    footButtons:[
      {label:'Cancel',cls:'btn-ghost',onClick:closeModal},
      {label:'Add',cls:'btn-primary',onClick:()=>{
        const body=$('.modal-body',modal);
        const {data,missing}=collectFormData(body,schema.fields);
        if(missing.length){ toast('Please fill: '+missing.join(', '),'danger'); return; }
        Object.assign(data,preset);
        addRecord(type,data);
        toast(schema.label+' added','success'); closeModal();
        renderView(currentView,currentViewParam);
      }}
    ]
  });
  wireImageInputs($('.modal-body',modal));
}

function miniTable(headers, rows, emptyMsg){

/* =========================================================================
   ANALYSIS
   ========================================================================= */
function renderAnalysis(){
  const vehRank = DB.vehicles.map(v=>({v, income:vehicleIncomeTotal(v.id,null,null), expense:vehicleExpenseTotal(v.id,null,null)}))
    .map(x=>({...x, profit:x.income-x.expense})).sort((a,b)=>b.profit-a.profit);
  const drvRank = DB.drivers.map(d=>({d, rev:driverRevenue(d.id,null,null), pts:driverPoints(d.id), incidents:driverIncidentCount(d.id)}))
    .sort((a,b)=>b.pts.net-a.pts.net);
  const custRank = DB.customers.map(c=>({c, rev:sum(DB.jobs.filter(j=>j.customerId===c.id),jobAmount), out:customerOutstanding(c.id), jobs:DB.jobs.filter(j=>j.customerId===c.id).length}))
    .sort((a,b)=>b.rev-a.rev);

  // vehicle-driver problem correlation
  const correlation = [];
  DB.vehicles.forEach(v=>{
    const driverIds = [...new Set(DB.jobs.filter(j=>j.vehicleId===v.id).map(j=>j.driverId).filter(Boolean))];
    driverIds.forEach(did=>{
      const assignments = DB.jobs.filter(j=>j.vehicleId===v.id && j.driverId===did).length;
      const issues = DB.maintenance.filter(m=>m.vehicleId===v.id && (m.type==='Breakdown'||m.type==='Accident/Damage') &&
        DB.jobs.some(j=>j.vehicleId===v.id&&j.driverId===did&&j.startDate<=m.date&&(j.endDate||'9999-99-99')>=m.date)).length;
      if(assignments>0) correlation.push({v, d:getById('drivers',did), assignments, issues, rate: issues/assignments});
    });
  });
  correlation.sort((a,b)=>b.rate-a.rate);

  const maxProfit = Math.max(1,...vehRank.map(x=>Math.abs(x.profit)));

  $('#content').innerHTML = `
    <div class="section-title" style="margin-top:0">Vehicle Profitability Ranking</div>
    <div class="table-wrap"><table class="data">
      <thead><tr><th>#</th><th>Vehicle</th><th>Income</th><th>Expense</th><th>Profit</th><th></th></tr></thead>
      <tbody>${vehRank.length? vehRank.map((x,i)=>`
        <tr data-id="${x.v.id}"><td>${i+1}</td><td><b>${esc(x.v.regNumber)}</b></td><td>${fmtMoney(x.income)}</td><td>${fmtMoney(x.expense)}</td>
        <td style="color:${x.profit>=0?'var(--green)':'var(--red)'};font-weight:700">${fmtMoney(x.profit)}</td>
        <td style="width:120px"><div class="progress"><div style="width:${clamp(Math.abs(x.profit)/maxProfit*100,0,100)}%;background:${x.profit>=0?'var(--green)':'var(--red)'}"></div></div></td></tr>`).join('') :
        `<tr class="empty-row"><td colspan="6">Add vehicles, jobs, and expenses to see profitability ranking.</td></tr>`}
      </tbody></table></div>

    <div class="section-title">Driver Performance Ranking</div>
    <div class="table-wrap"><table class="data">
      <thead><tr><th>#</th><th>Driver</th><th>Revenue Generated</th><th>Positive Pts</th><th>Negative Pts</th><th>Net Points</th><th>Incidents (assoc.)</th></tr></thead>
      <tbody>${drvRank.length? drvRank.map((x,i)=>`
        <tr data-driver="${x.d.id}"><td>${i+1}</td><td><b>${esc(x.d.name)}</b></td><td>${fmtMoney(x.rev)}</td>
        <td style="color:var(--green)">${x.pts.pos}</td><td style="color:var(--red)">${x.pts.neg}</td>
        <td style="font-weight:700;color:${x.pts.net>=0?'var(--green)':'var(--red)'}">${x.pts.net}</td><td>${x.incidents}</td></tr>`).join('') :
        `<tr class="empty-row"><td colspan="7">Add drivers and job history to see performance ranking.</td></tr>`}
      </tbody></table></div>

    <div class="section-title">Driver–Vehicle Problem Correlation <span class="tag">indicators, not causal claims</span></div>
    <div class="table-wrap"><table class="data">
      <thead><tr><th>Vehicle</th><th>Driver</th><th>Assignments</th><th>Recorded Issues</th><th>Issue Rate</th><th>Flag</th></tr></thead>
      <tbody>${correlation.length? correlation.slice(0,15).map(c=>`
        <tr><td>${esc(c.v.regNumber)}</td><td>${esc(c.d?c.d.name:'—')}</td><td>${c.assignments}</td><td>${c.issues}</td>
        <td>${(c.rate*100).toFixed(0)}%</td>
        <td>${c.rate>0.3&&c.assignments>=3? '<span class="pill pill-red">High incident frequency — requires review</span>' : c.issues>0? '<span class="pill pill-yellow">Monitor</span>':'<span class="pill pill-green">Normal</span>'}</td></tr>`).join('') :
        `<tr class="empty-row"><td colspan="6">No overlapping vehicle/driver/maintenance data yet.</td></tr>`}
      </tbody></table></div>
    <p class="small-note">This shows statistical association between drivers and recorded vehicle issues during their assignments — it does not assign blame. Use it as a starting point for review, not a conclusion.</p>

    <div class="section-title">Top Customers by Revenue</div>
    <div class="table-wrap"><table class="data">
      <thead><tr><th>Customer</th><th>Jobs</th><th>Revenue</th><th>Outstanding</th></tr></thead>
      <tbody>${custRank.length? custRank.slice(0,10).map(c=>`
        <tr><td><b>${esc(c.c.name)}</b></td><td>${c.jobs}</td><td>${fmtMoney(c.rev)}</td><td style="color:${c.out>0?'var(--yellow)':'var(--text)'}">${fmtMoney(c.out)}</td></tr>`).join('') :
        `<tr class="empty-row"><td colspan="4">Add customers and jobs to see revenue ranking.</td></tr>`}
      </tbody></table></div>
  `;
  $$('tr[data-id]',$('#content')).forEach(tr=>tr.addEventListener('click',()=>navigate('vehicle-detail',tr.getAttribute('data-id'))));
  $$('tr[data-driver]',$('#content')).forEach(tr=>tr.addEventListener('click',()=>navigate('driver-detail',tr.getAttribute('data-driver'))));
}

/* =========================================================================
   REPORTS  (P&L by period)
   ========================================================================= */
function renderReports(){
  const state = viewState.reports || (viewState.reports = {from:'', to:''});
  const from = state.from, to = state.to;
  const income = totalIncomeInRange(from||null, to||null);
  const expense = totalExpenseInRange(from||null, to||null);
  const driverCost = sum(DB.salaries.filter(s=>inRange(s.paymentDate,from,to)), s=>s.paidAmount);
  const maintCost = sum(DB.maintenance.filter(m=>inRange(m.date,from,to)), m=>maintTotalCost(m));
  const fuelCost = sum(DB.expenses.filter(e=>e.category==='Fuel/Diesel' && inRange(e.date,from,to)), e=>e.amount);
  const otherCost = expense - driverCost - maintCost - fuelCost;

  // monthly trend (last 6 months)
  const months=[]; const now=new Date();
  for(let i=5;i>=0;i--){ const dt=new Date(now.getFullYear(),now.getMonth()-i,1); months.push(dt); }
  const monthData = months.map(dt=>{
    const f = dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-01';
    const lastDay = new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate();

      <div class="stat-card ${income-expense>=0?'good':'bad'}"><div class="bar"></div><div class="label">Net Profit</div><div class="value">${fmtMoney(income-expense)}</div>
        <div class="sub">Margin: ${income>0?((income-expense)/income*100).toFixed(1):'0'}%</div></div>

    <div class="two-col">

        ${costRow('Other Costs',Math.max(0,otherCost),expense)}
      </div>
      <div class="panel">
        <div class="section-title" style="margin-top:0">Monthly Profit Trend (last 6 months)</div>
        <div class="barchart">
          ${monthData.map(m=>`<div class="bar" style="height:${clamp(Math.abs(m.profit)/maxAbs*100,3,100)}%;${m.profit<0?'background:linear-gradient(180deg,var(--red),#b23a3a)':''}">

      }).join('') : `<tr class="empty-row"><td colspan="4">No vehicles yet.</td></tr>`}</tbody>
    </table></div>
  `;
  $('#rep-apply').onclick=()=>{ state.from=$('#rep-from').value; state.to=$('#rep-to').value; renderReports(); };
  $('#rep-clear').onclick=()=>{ state.from=''; state.to=''; renderReports(); };
  $('#rep-today').onclick=()=>{ [state.from,state.to]=periodRange('today'); renderReports(); };
  $('#rep-week').onclick=()=>{ [state.from,state.to]=periodRange('week'); renderReports(); };
  $('#rep-month').onclick=()=>{ [state.from,state.to]=periodRange('month'); renderReports(); };
  $('#rep-year').onclick=()=>{ [state.from,state.to]=periodRange('year'); renderReports(); };
}
function costRow(label,val,total){
  const pct = total>0? (val/total*100):0;

}

function openUserForm(id){
  const existing = id? DB.users.find(u=>u.id===id):null;
  const fields=[
    {key:'name',label:'Full Name',required:true},
    {key:'username',label:'Username',required:true},
    {key:'password',label:'Password',required:!existing},
    {key:'role',label:'Role',type:'select',options:['Admin','Manager','Viewer'],default:'Manager'},
  ];
  const modal=openModal({title:existing?'Edit User':'Add User', bodyHtml:renderFormFields(fields,existing),
    footButtons:[{label:'Cancel',cls:'btn-ghost',onClick:closeModal},
      {label:'Save',cls:'btn-primary',onClick:()=>{
        const body=$('.modal-body',modal); const {data,missing}=collectFormData(body,fields);
        if(missing.length){ toast('Please fill: '+missing.join(', '),'danger'); return; }
        if(existing){ if(!data.password) delete data.password; Object.assign(existing,data); }
        else{ data.id=uid('usr'); DB.users.push(data); }
        saveDB(); toast('User saved','success'); closeModal(); renderSettings();
      }}]});
}

function globalSearch(q){
  q = q.trim().toLowerCase();
  if(!q) return;
  const v = DB.vehicles.find(x=>(x.regNumber||'').toLowerCase().includes(q));
  if(v){ navigate('vehicle-detail', v.id); return; }
  const d = DB.drivers.find(x=>(x.name||'').toLowerCase().includes(q));
  if(d){ navigate('driver-detail', d.id); return; }
  const s = DB.sites.find(x=>(x.name||'').toLowerCase().includes(q));
  if(s){ navigate('site-detail', s.id); return; }
  const c = DB.customers.find(x=>(x.name||'').toLowerCase().includes(q));
  if(c){ navigate('customers'); toast('Found customer: '+c.name); return; }
  toast('No match found for "'+q+'"','danger');
}

  window.renderAbout = function(){
    ensureStyle();
    const el=document.getElementById('content'); if(!el) return;
    const tabs=[
      ['copy','© Copyright','பதிப்புரிமை',paneCopyright],
      ['feat','Features','அம்சங்கள்',paneFeatures],
      ['how','How to Use','பயன்படுத்தும் முறை',paneHow],
      ['tips','Tips & FAQ','குறிப்புகள்',paneTips]
    ];

      return '<div class="tab'+(i===0?' active':'')+'" data-t="'+t[0]+'">'+t[1]+' · '+t[2]+'</div>';
    }).join('')+'</div><div id="cr-pane"></div>';
    const pane=document.getElementById('cr-pane');

      const t=tabs.filter(function(x){return x[0]===k;})[0];
      pane.innerHTML=t[3]();
      Array.prototype.forEach.call(document.querySelectorAll('#cr-tabs .tab'),function(n){
        n.classList.toggle('active', n.getAttribute('data-t')===k);
      });
    }
    Array.prototype.forEach.call(document.querySelectorAll('#cr-tabs .tab'),function(n){
      n.onclick=function(){ show(n.getAttribute('data-t')); };
    });
    show('copy');
  };

  /* ---------- start guarding ---------- */
  function start(){ guard(); setInterval(guard, 2000); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
</body>
</html>
