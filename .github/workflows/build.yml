name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required files are in the repo
        shell: pwsh
        run: |
          Get-ChildItem
          $missing = @()
          foreach ($f in "main.py","index.html","logo.png","requirements.txt") {
            if (-not (Test-Path $f)) { $missing += $f }
          }
          if ($missing.Count -gt 0) {
            Write-Error "Missing in repo root: $($missing -join ', ')"
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8' # Windows 7 compatible version

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE with PyInstaller
        run: |
          python -m PyInstaller --noconsole --onefile --name main --add-data "index.html;." --add-data "logo.png;." main.py

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FleetManagementSoftware
          path: dist/main.exe
